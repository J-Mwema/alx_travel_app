name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: python -m pip install -r alx_travel_app/alx_travel_app/requirement.txt

      - name: Run Django checks
        env:
          DB_ENGINE: sqlite
          DB_NAME: db.sqlite3
          SECRET_KEY: ci-test-secret-key
        run: |
          cd alx_travel_app
          python manage.py check
          python manage.py test
